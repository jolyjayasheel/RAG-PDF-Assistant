services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-pdf-backend

    ports:
      - "8000:8000"

    volumes:

      # Backend source code
      - ./backend:/app/backend

      # Uploaded files
      - ./uploads:/app/uploads

      # Chroma database
      - ./chroma_db_dynamic:/app/chroma_db_dynamic

      # HuggingFace model cache
      - huggingface_cache:/root/.cache/huggingface

    environment:

      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}

    env_file:
      - .env

    networks:
      - rag-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/status"
        ]

      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


networks:

  rag-network:
    driver: bridge


volumes:

  huggingface_cache: