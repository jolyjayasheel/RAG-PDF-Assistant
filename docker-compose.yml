version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-pdf-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for development
      - ./backend:/app/backend

      # Persistent volumes
      - ./uploads:/app/uploads
      - ./chroma_db_dynamic:/app/chroma_db_dynamic

    environment:
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

      # Load from .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434

    env_file:
      - .env

    depends_on:
      - ollama

    networks:
      - rag-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  # Ollama Service
  ollama:
    image: ollama/ollama:latest
    container_name: rag-pdf-ollama

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - rag-network

    restart: unless-stopped


networks:
  rag-network:
    driver: bridge


volumes:
  ollama_data: